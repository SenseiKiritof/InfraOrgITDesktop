name: publish

# Unsigned packaging only: no signing secrets, no notarization, no release or
# tag creation. Signing (macOS Developer ID and Windows certificate),
# notarization and auto-update remain manual follow-ups.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version used in artifact names (leading v is stripped)
        required: false
        default: "0.1.0"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION:-0.1.0}"
          fi
          if ! [[ "$version" =~ ^[0-9A-Za-z.+-]+$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Packaging version $version"

  package:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            os: macos-latest
          # Intel macOS: macos-13 was retired in December 2025; the
          # macos-15-intel image is the remaining x86_64 runner.
          - rid: osx-x64
            os: macos-15-intel
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish and package
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: bash scripts/publish.sh ${{ matrix.rid }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: InfraOrgIT-Desktop-${{ needs.version.outputs.version }}-${{ matrix.rid }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
