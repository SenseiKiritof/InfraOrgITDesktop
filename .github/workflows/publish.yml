name: publish

# Packages the Electron shell for macOS (arm64 and x64), Windows x64 and
# Linux x64. The packages are unsigned: Developer ID signing, macOS
# notarization, Windows Authenticode signing and auto-update are follow-ups.
# A v* tag publishes or updates a GitHub Release from the tag that already
# exists: the workflow never creates tags. Manual runs only upload workflow
# artifacts.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version used in artifact names and the app bundle (leading v is stripped)
        required: false
        default: "0.1.0"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION:-0.1.0}"
          fi
          if ! [[ "$version" =~ ^[0-9A-Za-z.+-]+$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Packaging version $version"

  package:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: osx-arm64
            os: macos-latest
            platform: darwin
            arch: arm64
          - target: osx-x64
            os: macos-15-intel
            platform: darwin
            arch: x64
          - target: win-x64
            os: windows-latest
            platform: win32
            arch: x64
          - target: linux-x64
            os: ubuntu-latest
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag must be checked against the full main history; a shallow
          # tag checkout cannot prove that the tagged commit is on main.
          fetch-depth: 0

      - name: Version tag must be on main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Version tags must point to a commit on main."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        run: npm ci --prefix electron

      - name: Package
        shell: bash
        working-directory: electron
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          npx electron-packager . InfraOrgIT \
            --platform="$PLATFORM" \
            --arch="$ARCH" \
            --out=../dist \
            --asar \
            --overwrite \
            --app-version="$VERSION" \
            --app-bundle-id=it.infraorgit.desktop \
            --ignore="^/test($|/)" \
            --ignore="^/node_modules($|/)" \
            --ignore="^/README\.md$" \
            --ignore="^/package-lock\.json$"

      - name: Create archive
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          archive_base="dist/InfraOrgIT-Desktop-$VERSION-$TARGET"
          case "$PLATFORM" in
            darwin)
              app="dist/InfraOrgIT-darwin-$ARCH/InfraOrgIT.app"
              if [ ! -d "$app" ]; then
                echo "::error::Missing app bundle: $app"
                exit 1
              fi
              # --keepParent keeps InfraOrgIT.app as the zip root.
              ditto -c -k --keepParent "$app" "$archive_base.zip"
              echo "Archive: $archive_base.zip"
              ;;
            win32)
              folder="dist/InfraOrgIT-win32-$ARCH"
              if [ ! -d "$folder" ]; then
                echo "::error::Missing package folder: $folder"
                exit 1
              fi
              # Archive the folder itself so InfraOrgIT-win32-x64 is the root.
              powershell -NoProfile -Command "Compress-Archive -Path '$folder' -DestinationPath '$archive_base.zip' -Force"
              echo "Archive: $archive_base.zip"
              ;;
            linux)
              folder="dist/InfraOrgIT-linux-$ARCH"
              if [ ! -d "$folder" ]; then
                echo "::error::Missing package folder: $folder"
                exit 1
              fi
              tar -czf "$archive_base.tar.gz" -C dist "InfraOrgIT-linux-$ARCH"
              echo "Archive: $archive_base.tar.gz"
              ;;
            *)
              echo "::error::Unsupported platform: $PLATFORM"
              exit 1
              ;;
          esac

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/*.zip dist/*.tar.gz)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "No archives found to checksum." >&2
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            hasher=(sha256sum)
          elif command -v shasum >/dev/null 2>&1; then
            hasher=(shasum -a 256)
          else
            echo "Neither sha256sum nor shasum is available." >&2
            exit 1
          fi
          for archive in "${archives[@]}"; do
            hash="$("${hasher[@]}" "$archive" | awk '{print $1}')"
            printf '%s  %s\n' "$hash" "$(basename "$archive")" \
              > "$archive.sha256"
            echo "Checksum: $archive.sha256"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: InfraOrgIT-Desktop-${{ needs.version.outputs.version }}-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [version, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: InfraOrgIT Desktop ${{ needs.version.outputs.version }}
          files: |
            release/*.zip
            release/*.tar.gz
            release/*.sha256
          generate_release_notes: true
