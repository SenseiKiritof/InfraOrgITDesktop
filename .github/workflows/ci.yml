name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore InfraOrgITDesktop.slnx
      - name: Build
        run: dotnet build InfraOrgITDesktop.slnx --no-restore -warnaserror
      - name: Test
        run: dotnet test InfraOrgITDesktop.slnx --no-build
