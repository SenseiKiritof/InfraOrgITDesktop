name: smoke

# Headless startup check for the Linux build: Photino must create the manager
# window under Xvfb and keep the process alive. Kept separate from ci.yml so
# the cross-platform build-test matrix stays unchanged.

on:
  workflow_dispatch:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install WebKitGTK and Xvfb
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-0 \
            libgtk-3-0t64 \
            libnotify4 \
            xvfb \
            xauth

      - name: Build
        run: dotnet build InfraOrgITDesktop.slnx -warnaserror

      - name: Headless startup smoke test
        run: bash scripts/smoke.sh
